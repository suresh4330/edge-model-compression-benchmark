name: CIFAR-100 F1 Evaluation

on:
  workflow_dispatch:
  push:
    paths:
      - "evaluate_f1.py"
      - "backend/**"
      - "models/**"
      - "requirements.txt"
      - ".github/workflows/evaluate-f1.yml"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: |
          python -m pip install pandas matplotlib tqdm torch-pruning fastapi uvicorn pillow python-multipart scikit-learn

      - name: Run CIFAR-100 F1 evaluation
        run: python evaluate_f1.py

      - name: Upload F1 evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cifar100-f1-evaluation
          path: |
            results/f1_evaluation.json
            results/f1_evaluation.csv
          if-no-files-found: warn
          retention-days: 30
